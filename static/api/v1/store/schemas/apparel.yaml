type: object
required:
  - store_id
properties:
  id:
    type: string
    format: UUIDv4
    description: Autogenerated UUID when a new apparel item is created.
    readOnly: true
  store_id:
    type: array
    description: The store IDs of the stores where you want to sell this item.
    items:
      type: string
      format: UUIDv4
  brand_id:
    type: string
    format: UUIDv4
    description: The brand ID of the brand associated with the apparel item.
  categories:
    type: array
    description: The categories and subcategories associated with the apparel item.
    items:
      type: object
      required:
        - category_id
      properties:
        category_id:
          type: string
          format: UUIDv4
          description: The category ID of the category associated with the apparel item.
        subcategories:
          type: array
          items:
            type: string
            format: UUIDv4
  colors:
    type: array
    description: The colors of the apparel item.
    items:
      type: string
    example: ["red","black","white"]
  sizes:
    type: array
    description: The sizes available of the apparel item.
    items:
      type: string
    example: ["S","M","L","XL"]
  description:
    type: string
    description: The description of the apparel item.
  fabrics:
    type: array
    description: The fabrics of the apparel item.
    items:
      type: string
    example: ["polyester","wool"]