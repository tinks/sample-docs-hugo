type: object
required:
- name
properties:
  id:
    type: string
    format: UUIDv4
    description: Autogenerated UUID when a new store is created.
    readOnly: true
  name:
    type: string
    description: Name of the store.
  logo:
    type: string
    format: URL
    description: Link to the logo of the store.
    readOnly: true