type: object
required:
- name
properties:
  id:
    type: string
    format: UUIDv4
    description: Autogenerated UUID when a new brand is created.
    readOnly: true
  name:
    type: string
    description: Name of the brand.
  logo:
    type: string
    format: URL
    description: Link to the logo of the brand.
    readOnly: true