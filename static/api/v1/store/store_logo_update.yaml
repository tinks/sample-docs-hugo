parameters:
  - name: id
    in: path
    description: The store ID for the store you have created.
    required: true
    schema:
      type: string
      format: UUIDv4
put:
  tags:
    - Store
  summary: Add logo to store
  description: |
    Add or update a logo for one of the stores you have created.
  operationId: createStoreLogo
  requestBody:
    content:
      image/jpeg:
        schema:
          type: string
          format: binary
      image/png:
        schema:
          type: string
          format: binary
  responses:
    "200":
      description: Success