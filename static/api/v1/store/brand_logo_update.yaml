parameters:
  - name: id
    in: path
    description: The brand ID for the brand you have created.
    required: true
    schema:
      type: string
      format: UUIDv4
put:
  tags:
    - Brand
  summary: Add logo to brand
  description: |
    Add or update a logo for one of the brands you have created.
  operationId: createBrandLogo
  requestBody:
    content:
      image/jpeg:
        schema:
          type: string
          format: binary
      image/png:
        schema:
          type: string
          format: binary
  responses:
    "200":
      description: Success
    "400":
      description: Bad Request