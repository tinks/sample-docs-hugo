type: object
required:
- name
properties:
  id:
    type: string
    format: UUIDv4
    description: Autogenerated UUID when a new subcategory is created.
    readOnly: true
  name:
    type: string
    description: Name of the subcategory.
  category_id:
    type: string
    format: UUIDv4
    description: The UUID of the category this subcategory belongs to.
    readOnly: true